name: Verif Sust
on: { workflow_dispatch: {} }
# Menos permisos posibles: ningun workflow escribe en el repo, solo lee el
# codigo y habla con APIs externas usando los secrets.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Muestra sustitutos
        run: node sustitutos.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          SAMPLE: '5'
      - uses: actions/upload-artifact@v4
        with: { name: verif, path: sustitutos-resultado.json }
