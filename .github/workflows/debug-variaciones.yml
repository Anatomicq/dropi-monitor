name: Debug variaciones Dropi
# Solo manual: imprime los campos de las variaciones de los 9 productos
# variables para diagnosticar el emparejamiento de pedidos.
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar variaciones
        run: node consultar-variaciones.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          # 4 ocultos + muestra de combos x2/x3 (deja vacío para volver a los 9 variables)
          IDS: '1841873'
