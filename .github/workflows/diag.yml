name: Diag Prov
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Diag proveedor
        run: node diag-prov.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
