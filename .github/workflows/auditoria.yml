name: Auditoria de Productos

on:
  schedule:
    # Bogota = UTC-5. Dos corridas al dia.
    - cron: '0 16 * * *'   # 11:00 am Bogota
    - cron: '0 22 * * *'   # 05:00 pm Bogota
  workflow_dispatch: {}     # permite correrla a mano desde la pestana Actions

# Menos permisos posibles: ningun workflow escribe en el repo, solo lee el
# codigo y habla con APIs externas usando los secrets.
permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auditar productos
        run: node auditar-productos.js
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
          # Activo desde el 2026-08-26: el Apps Script ya tiene desplegado el
          # manejador de body.auditoria, así que el aviso por correo no cae al
          # fallback que borra la pestaña "Inventario Dropi".
          AUDIT_EMAIL: '1'
