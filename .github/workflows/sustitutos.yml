name: Sustitutos Dropi
on:
  schedule:
    # 30 min después del monitor (para no chocar con Dropi). Colombia = UTC-5.
    - cron: '30 12 * * *'   # 07:30 Colombia
    - cron: '30 16 * * *'   # 11:30 Colombia
    - cron: '30 20 * * *'   # 15:30 Colombia
    - cron: '30 23 * * *'   # 18:30 Colombia
    - cron: '30 2 * * *'    # 21:30 Colombia
  workflow_dispatch:
    inputs:
      sample:
        description: 'Cuántos productos (vacío = todos)'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar sustitutos y escribir en el Sheet
        run: node sustitutos.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
          SAMPLE: ${{ github.event.inputs.sample }}
      - name: Subir resultado (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustitutos
          path: sustitutos-resultado.json
          if-no-files-found: warn
