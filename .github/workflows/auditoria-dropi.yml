name: Auditoria Dropi-Shopify
# Auditoría 3 vías + jerarquía de categorías → pestaña "Auditoría" del Sheet.
# Lunes 7:00 Colombia (12:00 UTC) y manual.
# RETIRADO en el cutover 2026-08-27: la auditoría Dropi vs Shopify vive ahora en
# la pestaña consolidada (columna R "Inv Dropi/Shopify", roja si dif>20%). Se deja
# solo manual por si se necesita el formato viejo puntual.
on:
  workflow_dispatch: {}

# Menos permisos posibles: ningun workflow escribe en el repo, solo lee el
# codigo y habla con APIs externas usando los secrets.
permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auditoria -> Excel (pestaña Auditoría)
        run: node auditoria.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
