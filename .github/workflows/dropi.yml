name: Dropi Monitor

on:
  schedule:
    # Cada hora (GitHub usa UTC; la hora exacta puede correrse unos minutos por carga de GitHub).
    - cron: '0 * * * *'
  workflow_dispatch: {}     # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stock Dropi → Excel + Shopify
        run: node dropi-cloud.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Falla la corrida (y GitHub avisa por correo) si la vitrina publica
          # no refleja el inventario — ver verificar-vitrina.js
          STRICT_VITRINA: '1'
      # En la MISMA corrida, actualiza los sustitutos en el mismo Excel (pestaña "Sustitutos").
      # if: always() → corre aunque el paso de stock haya terminado con advertencia.
      - name: Sustitutos → Excel (pestaña Sustitutos)
        if: always()
        run: node sustitutos.js
        env:
          DROPI_EMAIL: ${{ secrets.DROPI_EMAIL }}
          DROPI_PASSWORD: ${{ secrets.DROPI_PASSWORD }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_SECRET: ${{ secrets.SHEETS_SECRET }}
      - name: Respaldo sustitutos (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustitutos
          path: sustitutos-resultado.json
          if-no-files-found: warn
